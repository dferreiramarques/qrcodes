<!doctype html>
<html lang="pt" data-theme="dark" data-brand="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de QR Code</title>
<meta name="version" content="2.0">
<meta name="theme-color" content="#141414">
<link rel="stylesheet" href="./ds/ds.css">
<style>
  /* App-specific overrides — nunca editar ds.css */
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .app {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--f-space-6) var(--f-space-4);
  }
  .qr-card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .qr-card h1 {
    font-size: var(--f-text-2xl);
    margin: 0 0 var(--f-space-5);
  }
  .f-field {
    text-align: left;
    margin-bottom: var(--f-space-4);
  }
  #qrcode {
    margin-top: var(--f-space-5);
    display: flex;
    justify-content: center;
  }
  #qrcode canvas,
  #qrcode img {
    border-radius: var(--f-r8);
    border: 1px solid var(--f-stroke2);
  }
  .download-section {
    display: none;
    margin-top: var(--f-space-5);
    justify-content: center;
  }
  .f-btn-generate {
    width: 100%;
  }
</style>
</head>
<body>

<header class="f-topbar">
  <div class="f-topbar-title">
    <span style="width:10px;height:10px;border-radius:50%;background:var(--f-brand);display:inline-block"></span>
    Gerador de QR Code
  </div>
  <button class="f-btn f-btn-subtle f-btn-sm" data-theme-toggle aria-label="Alternar tema">◐</button>
</header>

<main class="app">
  <div class="f-card qr-card">
    <h1>Gerador de QR Code</h1>

    <div class="f-field">
      <label class="f-label" for="urlInput">URL</label>
      <input type="url" id="urlInput" class="f-input" placeholder="https://exemplo.com" required>
    </div>

    <button class="f-btn f-btn-primary f-btn-generate" onclick="gerarQRCode()">Gerar QR Code</button>

    <div id="qrcode"></div>

    <div class="download-section" id="downloadSection">
      <button class="f-btn f-btn-secondary" onclick="downloadQRCode()">Download</button>
    </div>
  </div>
</main>

<script src="./ds/ds.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  (function () {
    try {
      var t = localStorage.getItem('ds-theme'); if (t) DS.theme.set(t);
      var b = localStorage.getItem('ds-brand'); if (b) DS.brand.set(b);
    } catch (e) {}
  })();

  var BASE_SIZE = 200;
  var DOWNLOAD_SCALE = 2; // download em resolução dupla

  function gerarQRCode() {
    var url = document.getElementById('urlInput').value;
    var container = document.getElementById('qrcode');
    var downloadSection = document.getElementById('downloadSection');

    if (!url) {
      DS.toast('Por favor, insira um URL', { type: 'danger' });
      return;
    }

    container.innerHTML = '';

    new QRCode(container, {
      text: url,
      width: BASE_SIZE,
      height: BASE_SIZE,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    downloadSection.style.display = 'flex';
  }

  function buildFilename(url) {
    var filename;
    try {
      var urlToParse = url;
      if (!/^https?:\/\//i.test(url)) {
        urlToParse = 'https://' + url;
      }
      var urlObj = new URL(urlToParse);
      filename = urlObj.hostname.replace(/^www\./i, '');
      if (urlObj.pathname && urlObj.pathname !== '/') {
        var path = urlObj.pathname.replace(/^[\/]+|[\/]+$/g, '').replace(/[\/]/g, '-');
        if (path) filename += '-' + path;
      }
    } catch (e) {
      filename = url.replace(/^https?:\/\//i, '').replace(/[\/].*$/, '');
    }
    return (filename || 'qrcode').replace(/[^a-zA-Z0-9.-]/g, '_') + '.png';
  }

  function downloadQRCode() {
    var url = document.getElementById('urlInput').value;
    var displayedCanvas = document.querySelector('#qrcode canvas');
    if (!displayedCanvas || !url) {
      DS.toast('Gere primeiro um QR Code', { type: 'danger' });
      return;
    }

    // Gera uma versão à parte, no dobro da resolução, só para o download
    var hiResContainer = document.createElement('div');
    hiResContainer.style.display = 'none';
    document.body.appendChild(hiResContainer);

    new QRCode(hiResContainer, {
      text: url,
      width: BASE_SIZE * DOWNLOAD_SCALE,
      height: BASE_SIZE * DOWNLOAD_SCALE,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    var hiResCanvas = hiResContainer.querySelector('canvas');

    var link = document.createElement('a');
    link.download = buildFilename(url);
    link.href = hiResCanvas.toDataURL('image/png');
    link.click();

    document.body.removeChild(hiResContainer);
  }

  document.getElementById('urlInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      gerarQRCode();
    }
  });
</script>
</body>
</html>
