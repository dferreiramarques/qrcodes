<style>
  /* App-specific overrides — nunca editar ds.css. Mobile-first: estilos base
     pensados para ecrãs pequenos, com ajustes progressivos a partir daqui. */
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .f-topbar {
    padding-left: max(var(--f-space-4), env(safe-area-inset-left));
    padding-right: max(var(--f-space-4), env(safe-area-inset-right));
  }
  .app {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--f-space-5) var(--f-space-4);
    padding-bottom: max(var(--f-space-5), env(safe-area-inset-bottom));
  }
  .qr-card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .qr-card h1 {
    font-size: var(--f-text-xl);
    margin: 0 0 var(--f-space-5);
  }
  .f-field {
    text-align: center;
    margin-bottom: var(--f-space-4);
  }
  /* 16px evita zoom automático no iOS ao focar o campo */
  #urlInput {
    font-size: 16px;
    text-align: center;
  }
  #qrcode {
    margin-top: var(--f-space-5);
    display: flex;
    justify-content: center;
  }
  #qrcode canvas,
  #qrcode img {
    max-width: 100%;
    height: auto;
    border-radius: var(--f-r8);
    border: 1px solid var(--f-stroke2);
  }
  .download-section {
    display: none;
    margin-top: var(--f-space-5);
    justify-content: center;
  }
  .f-btn-generate,
  .download-section .f-btn {
    width: 100%;
    min-height: 44px; /* alvo de toque confortável em mobile */
  }
  @media (min-width: 480px) {
    .qr-card h1 { font-size: var(--f-text-2xl); }
    .app { padding: var(--f-space-6) var(--f-space-4); }
  }
</style>
</head>
<body>

<header class="f-topbar">
  <div class="f-topbar-title">
    <span style="width:10px;height:10px;border-radius:50%;background:var(--f-brand);display:inline-block"></span>
    Gerador de QR Code
  </div>
  <button class="f-btn f-btn-subtle f-btn-sm" data-theme-toggle aria-label="Alternar tema">◐</button>
</header>

<main class="app">
  <div class="f-card qr-card">
    <h1>Gerador de QR Code</h1>

    <div class="f-field">
      <label class="f-label" for="urlInput">URL</label>
      <input type="url" id="urlInput" class="f-input" placeholder="https://exemplo.com" required>
    </div>

    <button class="f-btn f-btn-primary f-btn-generate" onclick="gerarQRCode()">Gerar QR Code</button>

    <div id="qrcode"></div>

    <div class="download-section" id="downloadSection">
      <button class="f-btn f-btn-secondary" onclick="downloadQRCode()">Download</button>
    </div>
  </div>
</main>

<script>
/* ==========================================================================
   DM Design System — Runtime
   Zero dependencies. ~3KB. Exposes window.DS
   ==========================================================================
   DS.theme.get()      → 'light' | 'dark'
   DS.theme.set(t)     → set and persist
   DS.theme.toggle()   → flip
   DS.brand.set(name)  → 'blue' | 'green' | 'lime' | …
   DS.toast(msg, opts) → { type, duration }
   DS.modal.open(el)   → open a .f-modal-overlay
   DS.modal.close(el)
   DS.tabs(container)  → wire up [role=tab] switching
   ========================================================================== */
(function (global) {
  'use strict';

  var STORE_THEME = 'ds-theme';
  var STORE_BRAND = 'ds-brand';
  var root = document.documentElement;

  /* ── Theme ─────────────────────────────────────────────────────── */
  var theme = {
    get: function () {
      return root.getAttribute('data-theme') || 'light';
    },
    set: function (value) {
      root.setAttribute('data-theme', value);
      try { localStorage.setItem(STORE_THEME, value); } catch (e) {}
      updateMetaThemeColor();
      emit('ds:themechange', { theme: value });
      return value;
    },
    toggle: function () {
      return theme.set(theme.get() === 'dark' ? 'light' : 'dark');
    },
    /* Follow the OS unless the user has made an explicit choice */
    auto: function () {
      try { localStorage.removeItem(STORE_THEME); } catch (e) {}
      var prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
      root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      updateMetaThemeColor();
    }
  };

  var brand = {
    get: function () { return root.getAttribute('data-brand') || 'blue'; },
    set: function (name) {
      root.setAttribute('data-brand', name);
      try { localStorage.setItem(STORE_BRAND, name); } catch (e) {}
      updateMetaThemeColor();
      emit('ds:brandchange', { brand: name });
      return name;
    }
  };

  function updateMetaThemeColor() {
    var meta = document.querySelector('meta[name="theme-color"]');
    if (!meta) return;
    var bg = getComputedStyle(root).getPropertyValue('--f-bg1').trim();
    if (bg) meta.setAttribute('content', bg);
  }

  function emit(name, detail) {
    document.dispatchEvent(new CustomEvent(name, { detail: detail }));
  }

  /* ── Toast ─────────────────────────────────────────────────────── */
  function toast(message, opts) {
    opts = opts || {};
    var container = document.querySelector('.f-toast-container');
    if (!container) {
      container = document.createElement('div');
      container.className = 'f-toast-container';
      container.setAttribute('role', 'status');
      container.setAttribute('aria-live', 'polite');
      document.body.appendChild(container);
    }
    var el = document.createElement('div');
    el.className = 'f-toast' + (opts.type ? ' f-toast-' + opts.type : '');
    el.textContent = message;
    container.appendChild(el);

    var duration = opts.duration == null ? 3200 : opts.duration;
    if (duration > 0) {
      setTimeout(function () {
        el.classList.add('is-leaving');
        el.addEventListener('animationend', function () { el.remove(); });
      }, duration);
    }
    return el;
  }

  /* ── Modal ─────────────────────────────────────────────────────── */
  var lastFocused = null;
  var modal = {
    open: function (target) {
      var el = typeof target === 'string' ? document.querySelector(target) : target;
      if (!el) return;
      lastFocused = document.activeElement;
      el.hidden = false;
      var focusable = el.querySelector('input, button, textarea, select, [tabindex]');
      if (focusable) focusable.focus();
      document.body.style.overflow = 'hidden';
      emit('ds:modalopen', { modal: el });
    },
    close: function (target) {
      var el = typeof target === 'string' ? document.querySelector(target) : target;
      if (!el) return;
      el.hidden = true;
      document.body.style.overflow = '';
      if (lastFocused) lastFocused.focus();
      emit('ds:modalclose', { modal: el });
    }
  };

  /* Close on overlay click and Escape */
  document.addEventListener('click', function (e) {
    if (e.target.classList && e.target.classList.contains('f-modal-overlay')) {
      modal.close(e.target);
    }
    var opener = e.target.closest('[data-modal-open]');
    if (opener) modal.open(opener.getAttribute('data-modal-open'));
    var closer = e.target.closest('[data-modal-close]');
    if (closer) {
      var overlay = closer.closest('.f-modal-overlay');
      if (overlay) modal.close(overlay);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var open = document.querySelector('.f-modal-overlay:not([hidden])');
    if (open) modal.close(open);
  });

  /* ── Tabs ──────────────────────────────────────────────────────── */
  function tabs(container) {
    var el = typeof container === 'string' ? document.querySelector(container) : container;
    if (!el) return;
    var tabButtons = el.querySelectorAll('[role="tab"]');
    tabButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        tabButtons.forEach(function (b) {
          b.setAttribute('aria-selected', 'false');
          var panelId = b.getAttribute('aria-controls');
          var panel = panelId && document.getElementById(panelId);
          if (panel) panel.hidden = true;
        });
        btn.setAttribute('aria-selected', 'true');
        var id = btn.getAttribute('aria-controls');
        var target = id && document.getElementById(id);
        if (target) target.hidden = false;
      });
    });
  }

  /* ── Auto-wire declarative hooks ───────────────────────────────── */
  function init() {
    document.querySelectorAll('[data-theme-toggle]').forEach(function (btn) {
      btn.addEventListener('click', theme.toggle);
    });
    document.querySelectorAll('[data-brand-set]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        brand.set(btn.getAttribute('data-brand-set'));
      });
    });
    document.querySelectorAll('[role="tablist"]').forEach(function (list) {
      tabs(list.parentElement || list);
    });
    updateMetaThemeColor();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  global.DS = {
    theme: theme,
    brand: brand,
    toast: toast,
    modal: modal,
    tabs: tabs,
    version: '1.0.0'
  };
})(window);

</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  (function () {
    try {
      var t = localStorage.getItem('ds-theme'); if (t) DS.theme.set(t);
      var b = localStorage.getItem('ds-brand'); if (b) DS.brand.set(b);
    } catch (e) {}
  })();

  var BASE_SIZE = 200;
  var DOWNLOAD_SCALE = 2; // download em resolução dupla

  function gerarQRCode() {
    var url = document.getElementById('urlInput').value;
    var container = document.getElementById('qrcode');
    var downloadSection = document.getElementById('downloadSection');

    if (!url) {
      DS.toast('Por favor, insira um URL', { type: 'danger' });
      return;
    }

    container.innerHTML = '';

    new QRCode(container, {
      text: url,
      width: BASE_SIZE,
      height: BASE_SIZE,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    downloadSection.style.display = 'flex';
  }

  function buildFilename(url) {
    var filename;
    try {
      var urlToParse = url;
      if (!/^https?:\/\//i.test(url)) {
        urlToParse = 'https://' + url;
      }
      var urlObj = new URL(urlToParse);
      filename = urlObj.hostname.replace(/^www\./i, '');
      if (urlObj.pathname && urlObj.pathname !== '/') {
        var path = urlObj.pathname.replace(/^[\/]+|[\/]+$/g, '').replace(/[\/]/g, '-');
        if (path) filename += '-' + path;
      }
    } catch (e) {
      filename = url.replace(/^https?:\/\//i, '').replace(/[\/].*$/, '');
    }
    return (filename || 'qrcode').replace(/[^a-zA-Z0-9.-]/g, '_') + '.png';
  }

  function downloadQRCode() {
    var url = document.getElementById('urlInput').value;
    var displayedCanvas = document.querySelector('#qrcode canvas');
    if (!displayedCanvas || !url) {
      DS.toast('Gere primeiro um QR Code', { type: 'danger' });
      return;
    }

    // Redesenha o QR já gerado para um canvas maior (mínimo 400x400),
    // em vez de depender da biblioteca criar um segundo QR num
    // container escondido — assim garantimos sempre o tamanho exato.
    var targetSize = BASE_SIZE * DOWNLOAD_SCALE;
    var hiResCanvas = document.createElement('canvas');
    hiResCanvas.width = targetSize;
    hiResCanvas.height = targetSize;

    var ctx = hiResCanvas.getContext('2d');
    ctx.imageSmoothingEnabled = false; // mantém os módulos nítidos, sem desfoque
    ctx.drawImage(displayedCanvas, 0, 0, targetSize, targetSize);

    var link = document.createElement('a');
    link.download = buildFilename(url);
    link.href = hiResCanvas.toDataURL('image/png');
    link.click();
  }

  document.getElementById('urlInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      gerarQRCode();
    }
  });
</script>
</body>
</html>
